<!DOCTYPE html>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- =========================================================================
       STICKY TOP NAVIGATION BAR
       ========================================================================= -->
  <header class="navbar" role="banner">
    <div class="container navbar-container">
      <a href="#home" class="nav-brand" aria-label="M. Kiruthika Portfolio Home">
        <span class="brand-name" id="navBrandName">M. Kiruthika</span>
        <span class="brand-tag">Agricultural Engineering &bull; 2027</span>
      </a>

      <!-- Desktop Navigation Menu -->
      <nav role="navigation" aria-label="Main Navigation">
        <ul class="nav-menu" id="navMenu">
          <li><a href="#home" class="nav-link active">Home</a></li>
          <li><a href="#about" class="nav-link">About</a></li>
          <li><a href="#skills" class="nav-link">Skills</a></li>
          <li><a href="#projects" class="nav-link">Projects</a></li>
          <li><a href="#experience" class="nav-link">Experience</a></li>
          <li><a href="#achievements" class="nav-link">Achievements</a></li>
          <li><a href="#certificates" class="nav-link">Certificates</a></li>
          <li><a href="#contact" class="nav-link">Contact</a></li>

      </nav>

      <!-- Right Action: Download CV Button -->
      <div class="nav-actions">
        <a href="resume/Kiruthika_M_Resume.pdf" download="M_Kiruthika_Resume.pdf" class="btn btn-primary btn-nav" id="navDownloadCv" aria-label="Download M. Kiruthika's CV">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
          <span>Download CV</span>
        </a>

        <!-- Mobile Hamburger Toggle -->
        <button class="nav-toggle" id="navToggle" aria-label="Toggle Navigation Menu" aria-expanded="false" aria-controls="navMenu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
        </button>
      </div>
    </div>

       SECTION 1: HOME (HERO)
       ========================================================================= -->

    <div class="container hero-grid" id="heroContainer">
      <!-- Dynamically generated from data.json profile -->
    </div>

  <!-- =========================================================================
       SECTION 2: ABOUT
       ========================================================================= -->
  <section id="about" class="section">
    <div class="container" id="aboutContainer">
      <!-- Dynamically generated from data.json about -->
    </div>
  </section>

  <!-- =========================================================================
       SECTION 3: SKILLS
       ========================================================================= -->
  <section id="skills" class="section">
    <div class="container" id="skillsContainer">
      <!-- Dynamically generated from data.json skills -->
    </div>
  </section>

  <!-- =========================================================================
       SECTION 4: PROJECTS
       ========================================================================= -->
  <section id="projects" class="section">
    <div class="container" id="projectsContainer">
      <!-- Dynamically generated from data.json projects -->
    </div>
  </section>

  <!-- =========================================================================
       SECTION 5: EXPERIENCE
       ========================================================================= -->
  <section id="experience" class="section">
    <div class="container" id="experienceContainer">
      <!-- Dynamically generated from data.json experience -->

       ========================================================================= -->

    <div class="container" id="achievementsContainer">

       ========================================================================= -->

       ========================================================================= -->
  <footer class="footer" role="contentinfo">
    <div class="container footer-container" id="footerContainer">
      <!-- Dynamically generated from data.json footer -->
    </div>
  </footer>

  <!-- =========================================================================
       FLOATING BACK TO TOP BUTTON
       ========================================================================= -->
  <button class="back-to-top" id="backToTop" aria-label="Scroll back to top">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
  </button>

  <!-- =========================================================================
       CERTIFICATE LIGHTBOX MODAL
       ========================================================================= -->
  <div class="lightbox-modal" id="lightboxModal" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Certificate Enlarge Preview">
    <div class="lightbox-dialog">
      <div class="lightbox-header">
        <div class="lightbox-info">
          <h3 class="lightbox-title" id="lightboxTitle">Certificate</h3>
          <p class="lightbox-issuer" id="lightboxIssuer"></p>
        </div>
        <button class="lightbox-close" id="lightboxClose" aria-label="Close Certificate Preview">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
      <div class="lightbox-content">
        <img src="" alt="Enlarged Certificate View" class="lightbox-img" id="lightboxImg">
      </div>
    </div>
  </div>

  <!-- Main Interaction and Dynamic Render Script -->
  <script src="script.js"></script>
